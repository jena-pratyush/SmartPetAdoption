{% extends "layouts/base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container auth-shell">
    <div class="auth-card">
        <span class="eyebrow">Join SmartPet</span>
        <h1>Create your account</h1>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                    type="text"
                    class="form-control"
                    name="full_name"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    name="email"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                    type="text"
                    class="form-control"
                    name="phone">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                    type="password"
                    class="form-control"
                    name="confirm_password"
                    required>
            </div>

            <button class="btn btn-dark w-100">
                Register
            </button>
        </form>
    </div>
</div>

{% endblock %}
