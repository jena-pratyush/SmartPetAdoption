{% extends "layouts/base.html" %}

{% block title %}Edit {{ pet.name }}{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 700px;">

    <h2 class="mb-4">Edit {{ pet.name }} 🐾</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Pet Name</label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ pet.name }}"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Species</label>

            <select name="species" class="form-select" required>

                <option value="Dog"
                    {% if pet.species == "Dog" %}selected{% endif %}>
                    Dog
                </option>

                <option value="Cat"
                    {% if pet.species == "Cat" %}selected{% endif %}>
                    Cat
                </option>

                <option value="Rabbit"
                    {% if pet.species == "Rabbit" %}selected{% endif %}>
                    Rabbit
                </option>

                <option value="Bird"
                    {% if pet.species == "Bird" %}selected{% endif %}>
                    Bird
                </option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Breed</label>

            <input
                type="text"
                name="breed"
                class="form-control"
                value="{{ pet.breed or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Age</label>

            <input
                type="number"
                name="age"
                class="form-control"
                value="{{ pet.age }}"
                min="0"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>

            <select name="gender" class="form-select" required>

                <option value="Male"
                    {% if pet.gender == "Male" %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if pet.gender == "Female" %}selected{% endif %}>
                    Female
                </option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="5"
                required>{{ pet.description }}</textarea>
        </div>

        <button
            type="submit"
            class="btn btn-success">
            Save Changes
        </button>

        <a
            href="{{ url_for('pets.pet_details', pet_id=pet.id) }}"
            class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
